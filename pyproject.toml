[project]
name = "m3u8-downloader"
version = "0.1.0"
description = "CLI tool to download and trim steganographic HLS video streams disguised as PNGs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "tqdm>=4.66.0"
]

[project.scripts]
m3u8-downloader = "m3u8_downloader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
