[project]
name = "stego-hls"
version = "0.1.0"
description = "CLI tool to download and trim steganographic HLS video streams disguised as PNGs."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.25.0",
    "tqdm>=4.66.0"
]

[project.scripts]
stego-hls = "stego_hls.cli:main"
m3u8-downloader = "stego_hls.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
